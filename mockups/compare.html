<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Compare — Robert Ward mockups</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    background: #1a1a1a;
    color: #ddd;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    flex-shrink: 0;
    padding: 0.6rem 1rem;
    background: #111;
    border-bottom: 1px solid #333;
    display: flex;
    gap: 1rem;
    align-items: center;
    font-size: 13px;
  }
  header h1 { font-size: 13px; font-weight: 600; color: #fff; }
  header a { color: #6cb3ff; text-decoration: none; }
  header a:hover { text-decoration: underline; }
  .controls { display: flex; gap: 0.4rem; margin-left: auto; align-items: center; }
  .controls label { color: #999; font-size: 12px; }
  .controls input[type=range] { width: 90px; }
  .grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: 1fr 1fr;
    gap: 1px;
    background: #333;
    overflow: hidden;
  }
  .pane {
    background: #fff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }
  .pane .label {
    position: absolute;
    top: 0; left: 0; right: 0;
    background: rgba(17, 17, 17, 0.85);
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 10px;
    z-index: 2;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    pointer-events: none;
  }
  .pane .label .sub {
    color: #aaa;
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;
    margin-left: 0.5em;
  }
  .pane iframe {
    flex: 1;
    width: 100%;
    border: 0;
    background: #fff;
  }
</style>
</head>
<body>
<header>
  <h1>Side-by-side</h1>
  <a href="index.html">← back to list</a>
  <div class="controls">
    <label>Zoom <input type="range" id="zoom" min="50" max="100" value="70"></label>
    <span id="zoomVal">70%</span>
  </div>
</header>
<div class="grid">
  <div class="pane">
    <div class="label">Current <span class="sub">live site</span></div>
    <iframe src="../index.html" loading="lazy"></iframe>
  </div>
  <div class="pane">
    <div class="label">A <span class="sub">Bactra</span></div>
    <iframe src="a-bactra.html" loading="lazy"></iframe>
  </div>
  <div class="pane">
    <div class="label">B <span class="sub">Garamond</span></div>
    <iframe src="b-garamond.html" loading="lazy"></iframe>
  </div>
  <div class="pane">
    <div class="label">C <span class="sub">Tufte</span></div>
    <iframe src="c-tufte.html" loading="lazy"></iframe>
  </div>
  <div class="pane">
    <div class="label">D <span class="sub">Academic hybrid</span></div>
    <iframe src="d-academic.html" loading="lazy"></iframe>
  </div>
  <div class="pane">
    <div class="label">E <span class="sub">Quiet</span></div>
    <iframe src="e-quiet.html" loading="lazy"></iframe>
  </div>
</div>
<script>
  const zoom = document.getElementById('zoom');
  const zoomVal = document.getElementById('zoomVal');
  const apply = () => {
    const v = zoom.value;
    zoomVal.textContent = v + '%';
    document.querySelectorAll('iframe').forEach(f => {
      f.style.transform = `scale(${v/100})`;
      f.style.transformOrigin = 'top left';
      f.style.width = (100 / (v/100)) + '%';
      f.style.height = (100 / (v/100)) + '%';
    });
  };
  zoom.addEventListener('input', apply);
  apply();
</script>
</body>
</html>
