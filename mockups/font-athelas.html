<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Athelas — body font preview</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; background: #111; }
  .label {
    position: fixed; top: 0; left: 0; right: 0;
    background: rgba(17,17,17,0.92);
    color: #fff;
    padding: 8px 16px;
    font-size: 13px;
    z-index: 10;
    display: flex; justify-content: space-between;
  }
  .label a { color: #6cb3ff; text-decoration: none; }
  iframe {
    width: 100%;
    height: calc(100vh - 33px);
    border: 0;
    background: #fff;
    margin-top: 33px;
  }
</style>
</head>
<body>
  <div class="label"><strong>Athelas</strong> body font · system serif (macOS, iOS — Apple Books) <a href="index.html">← back</a></div>
  <iframe src="../index.html" id="f"></iframe>
  <script>
    document.getElementById('f').addEventListener('load', () => {
      const f = document.getElementById('f');
      const doc = f.contentDocument;
      if (!doc) return;
      const style = doc.createElement('style');
      style.textContent = `
        body { font-family: Athelas, 'Iowan Old Style', Charter, Palatino, Georgia, serif !important; }
      `;
      doc.head.appendChild(style);
    });
  </script>
</body>
</html>
