<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Bio fonts on the page</title>
<style>
  body{margin:0;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
  .bar{position:fixed;top:0;left:0;right:0;background:rgba(17,17,17,.95);color:#fff;padding:8px 12px;font-size:13px;z-index:10;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .bar button{background:#2a2a2a;color:#ddd;border:1px solid #444;border-radius:4px;padding:4px 9px;font-size:12px;cursor:pointer}
  .bar button.on{background:#6cb3ff;color:#111;border-color:#6cb3ff}
  .bar a{color:#6cb3ff;text-decoration:none;margin-left:auto}
  .bar select{background:#2a2a2a;color:#fff;border:1px solid #444;border-radius:4px;padding:4px;font-size:12px}
  iframe{width:100%;height:calc(100vh - 75px);border:0;background:#fff;margin-top:75px}
</style></head><body>
<div class="bar" id="bar"><select id="pg"></select><span>Body font (←/→ to flip):</span><a href="index.html">← back</a></div>

const pg=document.getElementById('pg');PAGES.forEach(([n,u])=>{const o=document.createElement('option');o.value=u;o.textContent=n;pg.appendChild(o)});
pg.onchange=()=>{document.getElementById('f').src=pg.value};
const f=document.getElementById('f'),bar=document.getElementById('bar');let cur=0;
const btns=F.map((x,i)=>{const b=document.createElement('button');b.textContent=x[0];b.onclick=()=>set(i);bar.insertBefore(b,bar.querySelector('a'));return b});
function set(i){cur=(i+F.length)%F.length;btns.forEach((b,j)=>b.classList.toggle('on',j===cur));
 const d=f.contentDocument;if(!d||!d.head)return;const x=F[cur];
 if(x[2]&&!d.getElementById('l'+cur)){const l=d.createElement('link');l.id='l'+cur;l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+x[2]+'&display=swap';d.head.appendChild(l)}
 let s=d.getElementById('bio-override');if(!s){s=d.createElement('style');s.id='bio-override';d.head.appendChild(s)}
 s.textContent=`body,.bio p,.news-item p,.article p,.article li{font-family:${x[1]},Georgia,serif !important;font-size:${x[3]}px !important;line-height:${x[4]} !important;font-weight:${x[6]} !important;font-variation-settings:${x[5]} !important}`}
f.addEventListener('load',()=>set(cur));
if(f.contentDocument&&f.contentDocument.readyState==='complete')set(cur);
addEventListener('keydown',e=>{if(e.key==='ArrowRight')set(cur+1);if(e.key==='ArrowLeft')set(cur-1)});
