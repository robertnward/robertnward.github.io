<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library palette — Robert Ward</title>
<style>
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; background: #111; }
  .label {
    position: fixed; top: 0; left: 0; right: 0;
    background: rgba(17,17,17,0.92);
    color: #fff;
    padding: 8px 16px;
    font-size: 13px;
    z-index: 10;
    display: flex; justify-content: space-between;
  }
  .label a { color: #6cb3ff; text-decoration: none; }
  iframe {
    width: 100%;
    height: calc(100vh - 33px);
    border: 0;
    background: #fff;
    margin-top: 33px;
  }
</style>
</head>
<body>
  <div class="label"><strong>Library</strong> &middot; burgundy h1 + sienna nav + matching link &middot; bookish vintage <a href="index.html">&larr; back</a></div>
  <iframe src="../index.html" id="f"></iframe>
  <script>
    document.getElementById('f').addEventListener('load', () => {
      const doc = document.getElementById('f').contentDocument;
      if (!doc) return;
      const style = doc.createElement('style');
      style.textContent = `
        body { color: #2c2825 !important; }
        h1 { color: #5a2424 !important; }
        h2 { color: #5a2424 !important; }
        a { color: #5a2424 !important; border-bottom-color: #d8b8b8 !important; }
        a:hover { border-bottom-color: #5a2424 !important; }
        .nav-links, .nav-links a { color: #8a5a3c !important; }
        .nav-links .sep { color: #c8a888 !important; }
        .vitae, .vitae p { color: #8a7860 !important; }
        .vitae a { color: #8a7860 !important; border-bottom-color: #d0c4b0 !important; }
        .news-date { color: #5a2424 !important; }
      `;
      doc.head.appendChild(style);
    });
  </script>
</body>
</html>
